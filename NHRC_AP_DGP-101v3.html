<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>NHRC Complaint Management System | Arunachal Pradesh Police Headquarters</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3 L42 9 V23 C42 34 34 41 24 45 C14 41 6 34 6 23 V9 Z' fill='%23e0ecfb' stroke='%2335598c' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#2d3340; --muted:#69707d; --line:#e6e8ee; --soft:#f6f7f9;
  --lav:#ece6f9;   --lav-i:#57478c;
  --blue:#e0ecfb;  --blue-i:#35598c;
  --mint:#def3e7;  --mint-i:#2c6a4b;
  --peach:#fde8dc; --peach-i:#94502f;
  --butter:#fbf3d0;--butter-i:#77600f;
  --rose:#fbe1e7;  --rose-i:#963852;
  --sky:#dff2f7;   --sky-i:#2a6576;
  --sage:#e8efe0;  --sage-i:#51643a;
  --side:256px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;background:#ffffff;color:var(--ink);font-family:"Times New Roman",Times,serif;line-height:1.5}
body{font-size:clamp(15px,.3vw + 13.8px,17px);min-height:100dvh}
button,input,select,textarea{font-family:"Times New Roman",Times,serif;font-size:max(16px,1em);color:var(--ink)}
h1,h2,h3,h4{font-weight:normal;margin:0;line-height:1.25}
h1{font-size:clamp(23px,2.2vw,30px)} h2{font-size:clamp(19px,1.6vw,22px)} h3{font-size:clamp(17px,1.2vw,19px)}
a{color:var(--blue-i);cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--blue-i);outline-offset:2px}
.muted{color:var(--muted)} .s{font-size:.9em} .xs{font-size:.82em}
.right{text-align:right} .hide{display:none!important}
.bg-lav{background:var(--lav);color:var(--lav-i)}
.bg-blue{background:var(--blue);color:var(--blue-i)}
.bg-mint{background:var(--mint);color:var(--mint-i)}
.bg-peach{background:var(--peach);color:var(--peach-i)}
.bg-butter{background:var(--butter);color:var(--butter-i)}
.bg-rose{background:var(--rose);color:var(--rose-i)}
.bg-sky{background:var(--sky);color:var(--sky-i)}
.bg-sage{background:var(--sage);color:var(--sage-i)}
.bg-soft{background:var(--soft);color:var(--muted)}

/* ---------- Sign in ---------- */
.auth{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.auth-l{padding:calc(clamp(24px,5vw,72px) + var(--sat)) clamp(22px,5vw,72px) clamp(24px,4vw,56px) calc(clamp(22px,5vw,72px) + var(--sal));display:flex;flex-direction:column;justify-content:space-between;gap:30px;border-right:1px solid var(--line)}
.auth-r{padding:calc(clamp(20px,4vw,56px) + var(--sat)) calc(clamp(18px,4vw,56px) + var(--sar)) calc(clamp(20px,4vw,56px) + var(--sab)) clamp(18px,4vw,56px);display:flex;align-items:center;justify-content:center}
.brandrow{display:flex;align-items:center;gap:14px}
.brandrow .t{font-size:clamp(17px,1.4vw,20px);line-height:1.2}
.brandrow .st{color:var(--muted);font-size:.9em}
.auth-l h1{font-size:clamp(30px,3.6vw,48px);margin:20px 0 12px;max-width:17ch;line-height:1.1}
.auth-l .lead{color:var(--muted);max-width:520px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;max-width:540px;margin-top:26px;overflow:hidden}
.stats div{padding:14px 16px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-weight:normal;font-size:clamp(24px,2.4vw,30px);line-height:1.1}
.stats span{font-size:.85em;color:var(--muted)}
.chain{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;align-items:center}
.chain span{padding:5px 12px;border-radius:20px;font-size:.9em}
.chain i{font-style:normal;color:var(--muted)}
.legal{font-size:.8em;color:var(--muted);line-height:1.7;max-width:560px;border-top:1px solid var(--line);padding-top:16px}
.legal b{font-weight:normal;color:var(--ink)}
.pane{width:100%;max-width:420px}
.pane h2{font-size:clamp(24px,2.2vw,28px);margin-bottom:6px}
.pane .sub{color:var(--muted);margin:0 0 22px}
.tel{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.tel span{padding:0 12px;display:flex;align-items:center;background:var(--soft);color:var(--muted);border-right:1px solid var(--line)}
.tel input{border:0!important;border-radius:0!important}
.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,1.6vw,10px);margin:6px 0 10px}
.otp input{width:100%;aspect-ratio:5/6;max-height:64px;text-align:center;font-size:clamp(22px,5vw,28px);border:1px solid var(--line);border-radius:10px;padding:0;background:#fff}
.otp input:focus{border-color:var(--blue-i);outline:2px solid var(--blue);outline-offset:0}
.otp.bad input{border-color:#e8a5b6;background:#fff8fa}
.otp-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9em;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue-i);cursor:pointer;font-size:1em}
.linkbtn:disabled{color:var(--muted);cursor:default}
.err{color:var(--rose-i);background:var(--rose);border-radius:8px;padding:8px 12px;margin:0 0 12px;font-size:.92em}
.err:empty{display:none}
.demo-note{margin-top:18px;padding:10px 12px;border-radius:10px;font-size:.9em;background:var(--butter);color:var(--butter-i)}
.pane-brand{display:none;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.back{display:inline-block;margin-bottom:14px;font-size:.92em}
.ok-box{padding:14px;border-radius:10px;background:var(--mint);color:var(--mint-i);margin-bottom:14px}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;overflow-y:auto;border-right:1px solid var(--line);padding:calc(18px + var(--sat)) 12px calc(18px + var(--sab)) calc(12px + var(--sal));background:#fff;display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand .t{font-size:17px;line-height:1.2}.brand .st{font-size:13px;color:var(--muted)}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;margin-bottom:2px}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--blue);color:var(--blue-i)}
.nav .sec{font-size:13px;color:var(--muted);margin:16px 12px 6px;font-style:italic}
.badge{border-radius:20px;padding:0 8px;font-size:13px;background:var(--rose);color:var(--rose-i)}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + var(--sat)) calc(clamp(14px,2.2vw,30px) + var(--sar)) 10px clamp(14px,2.2vw,30px);border-bottom:1px solid var(--line)}
.hamb{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;align-items:center;justify-content:center;flex:none}
.hamb span,.hamb span::before,.hamb span::after{display:block;width:18px;height:1.5px;background:var(--ink);position:relative}
.hamb span::before,.hamb span::after{content:"";position:absolute;left:0}
.hamb span::before{top:-6px}.hamb span::after{top:6px}
.search-btn{flex:1;max-width:480px;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted);background:#fff;cursor:pointer;text-align:left;min-width:0}
.search-btn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--soft);color:var(--muted);white-space:nowrap}
.uwrap{margin-left:auto;position:relative;flex:none}
.uchip{display:flex;align-items:center;gap:10px;border:1px solid transparent;border-radius:10px;padding:4px 8px;cursor:pointer;background:none;text-align:left}
.uchip:hover{border-color:var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:none}
.uchip .un{line-height:1.15}.uchip .ur{font-size:13px;color:var(--muted);line-height:1.2}
.umenu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;min-width:250px;padding:6px;z-index:70}
.umenu .hd{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.umenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer}
.umenu button:hover{background:var(--soft)}
.page{padding:clamp(16px,2.4vw,32px) calc(clamp(16px,2.4vw,32px) + var(--sar)) calc(80px + var(--sab)) clamp(16px,2.4vw,32px);width:100%;max-width:1680px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.ph p{margin:4px 0 0;color:var(--muted);max-width:75ch}
.crumb{font-size:.9em;color:var(--muted);margin-bottom:6px}
.scrim{display:none}
.ribbon{position:fixed;left:calc(12px + var(--sal));bottom:calc(12px + var(--sab));z-index:40;background:#fff;border:1px solid #f2c6d1;color:var(--rose-i);font-size:12px;padding:4px 10px;border-radius:6px;pointer-events:none}

/* ---------- Blocks ---------- */
.card{border:1px solid var(--line);border-radius:12px;padding:clamp(14px,1.6vw,20px);background:#fff;min-width:0}
.card h3{margin-bottom:12px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ch h3{margin:0}
.grid{display:grid;gap:clamp(12px,1.4vw,16px);margin-bottom:clamp(12px,1.4vw,16px)}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g32{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.kpi{border-radius:12px;padding:14px 16px;cursor:pointer;border:1px solid transparent;min-width:0}
.kpi:hover{border-color:currentColor}
.kpi .n{font-size:clamp(28px,2.6vw,36px);line-height:1.1}
.kpi .l{font-size:.9em}
.kpi.static{cursor:default}.kpi.static:hover{border-color:transparent}
.pill{display:inline-block;padding:1px 10px;border-radius:20px;font-size:13px;white-space:nowrap;line-height:1.6}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:9px;cursor:pointer;line-height:1.3;min-height:38px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--blue);border-color:#c8daf3;color:var(--blue-i)}
.btn.ok{background:var(--mint);border-color:#c3e6d2;color:var(--mint-i)}
.btn.warn{background:var(--peach);border-color:#f5d0bb;color:var(--peach-i)}
.btn.danger{background:var(--rose);border-color:#f2c6d1;color:var(--rose-i)}
.btn.sm{padding:3px 10px;font-size:14px;min-height:30px}
.btn.block{width:100%;padding:12px;font-size:17px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

input[type=text],input[type=date],input[type=search],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;min-height:40px}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-size:.9em;color:var(--muted);margin-bottom:4px}
.fg{margin-bottom:14px}
.req::after{content:" *";color:var(--rose-i)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.filters .q{grid-column:span 2}
.drop{border:1.5px dashed #c8daf3;border-radius:10px;padding:14px;text-align:center;background:#fbfdff}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:.95em;margin:10px 0}

/* ---------- Tables ---------- */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:normal;color:var(--muted);font-size:.88em;background:#fcfcfd;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:#fafbfd}
.card table th{background:#fff}
.heat td,.heat th{text-align:center;padding:8px 6px}
.heat td:first-child,.heat th:first-child{text-align:left}
.heat td.c{cursor:pointer}
.mono{font-variant-numeric:tabular-nums}

/* ---------- Bars and flow ---------- */
.hbar{display:grid;grid-template-columns:minmax(110px,175px) 1fr 42px;align-items:center;gap:12px;padding:5px 0;cursor:pointer}
.hbar:hover .lbl{text-decoration:underline}
.track{background:var(--soft);border-radius:6px;height:22px;overflow:hidden}
.fill{height:100%;border-radius:6px;min-width:2px}
.fill.bg-mint{background:#b9e6cc}.fill.bg-sky{background:#b5e0ec}.fill.bg-butter{background:#f3e39a}.fill.bg-peach{background:#f7c7ab}
.fill.bg-rose{background:#f3b5c5}.fill.bg-lav{background:#d0c3f0}.fill.bg-blue{background:#bcd5f4}.fill.bg-sage{background:#cbdab8}.fill.bg-soft{background:#d9dde5}
.pipe{display:flex;align-items:stretch;gap:6px}
.pipe .st{flex:1;border-radius:12px;padding:14px 12px;cursor:pointer;border:1px solid transparent;min-width:0}
.pipe .st:hover{border-color:currentColor}
.pipe .st .h{font-size:1.15em}
.pipe .st .n{font-size:clamp(28px,2.6vw,36px);line-height:1.1;margin:4px 0}
.pipe .arrow{align-self:center;color:var(--muted);font-size:20px;text-align:center;line-height:1}
.pipe .arrow small{display:block;font-size:11px}
.stepper{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));margin:6px 0 4px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper .sp{text-align:center;padding:8px 6px;font-size:.9em;color:var(--muted);border-right:1px solid var(--line)}
.stepper .sp:last-child{border-right:0}
.stepper .sp.on{font-weight:bold}
.tl{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl:last-child{border-bottom:0}
.tl .num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.tl .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tl .nt{margin-top:4px;padding:8px 12px;background:var(--soft);border-radius:8px;font-style:italic;overflow-wrap:anywhere}
.tl.ev .nt{background:none;padding:0;font-style:normal;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px;margin-top:14px}
.meta div span{display:block;font-size:.85em;color:var(--muted)}
.att{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:0}
.att .ic{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px}
.att .nm{overflow-wrap:anywhere}
.att .bt{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.locked{font-size:13px;color:var(--muted)}
.bulk{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--butter);color:var(--butter-i);margin-bottom:12px}
.list-item{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:0}
.list-item:hover .ttl{text-decoration:underline}
.empty{padding:28px;text-align:center;color:var(--muted)}
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:12px;margin-bottom:16px}

/* ---------- Search palette, modal, toast ---------- */
.mbg{position:fixed;inset:0;background:rgba(45,51,64,.28);display:flex;align-items:flex-start;justify-content:center;padding:calc(8vh + var(--sat)) 16px calc(16px + var(--sab));z-index:80;overflow-y:auto}
.modal{background:#fff;border-radius:14px;border:1px solid var(--line);width:min(600px,100%);max-height:84dvh;overflow:auto;padding:clamp(16px,2vw,22px)}
.modal.wide{width:min(980px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sres{margin-top:10px}
.sres .grp{font-size:13px;color:var(--muted);margin:12px 4px 4px;font-style:italic}
.sres a{display:block;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.sres a:hover,.sres a.on{background:var(--blue)}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);background:var(--mint);color:var(--mint-i);border:1px solid #c3e6d2;padding:10px 18px;border-radius:10px;z-index:90;display:none;max-width:min(90vw,560px);text-align:center}
#toast.err{background:var(--rose);color:var(--rose-i);border-color:#f2c6d1}


/* ---------- v4: date filter, calendar, court orders, WhatsApp ---------- */
.dfbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:-2px 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fcfcfd}
.dfbar .dfl{color:var(--muted);font-size:.92em;display:flex;align-items:center;gap:6px}
.dfbar select,.dfbar input[type=date]{width:auto;flex:1 1 140px;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:14px}
.lg{display:flex;align-items:center;gap:6px;font-size:.92em;cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .wd{padding:8px 4px;font-size:.85em;color:var(--muted);background:#fcfcfd;border-bottom:1px solid var(--line);text-align:center}
.cal .cd{min-height:clamp(64px,8.5vw,112px);border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;font-size:1em}
.cal .cd:nth-child(7n){border-right:0}
.cal .cd:hover{background:#fafbfd}
.cal .cd.out{background:#fbfbfc;color:var(--muted)}
.cal .dn{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%;font-size:.95em}
.cal .cd.today .dn{background:var(--blue);color:var(--blue-i)}
.cal .cd.sel{box-shadow:inset 0 0 0 2px #8fb6ea}
.cal .chip{font-size:12px;border-radius:5px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%}
.cal .more{font-size:12px;color:var(--muted)}
.cal .dots{display:none;gap:3px;flex-wrap:wrap}
.ord{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.ord.focus{border-color:#b3a2e6;background:#fcfbff}
.ord-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.upd{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.upd .ud{color:var(--lav-i)}
.updform{margin-top:10px;padding:12px;border-radius:10px;background:var(--soft)}
.wa-from{display:flex;gap:8px;align-items:center;font-size:.92em;color:var(--mint-i);margin-bottom:6px}
.wa-line{padding:8px 0;border-bottom:1px solid var(--line)}.wa-line .hd{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;margin-bottom:2px}.ord-h .acts{align-items:flex-start}.wa-line:last-child{border-bottom:0}

function resolveRecip(k,c){
  var h=c?roleUser(c.holder,c):null,dsp=c?spId(c.district):null,m={holder:[h],holder_spc:[h,'spc'],district_sp:[dsp],spc_district:['spc',dsp],spc:['spc'],dgp:['dgp'],dgp_spc:['dgp','spc'],phq:['dgp','spc','icc']};
  var out=[];(m[k]||[]).forEach(function(x){if(x&&out.indexOf(x)<0&&(!c||canView(userById(x),c)))out.push(x);});return out;
}
function seedWA(cases){
  var r=mulberry32(808),now=Date.now(),msgs=[],seq=0,optOut={'sp-anjaw':true,'sp-dibang-valley':true};
  function mk(kind,rule,c,to,text,at,by,tpl){var u2=userById(to);seq++;var m={id:'w'+seq,batch:null,kind:kind,rule:rule,key:null,caseKey:c?c.key:null,to:to,toName:u2.name,toMobile:u2.mobile,text:text,tpl:tpl,by:by?by.id:'system',byName:by?by.name:SYSUSER.name,createdAt:new Date(at).toISOString(),sendAt:at,cancelled:false,logged:true,failed:!!optOut[to]};msgs.push(m);}
  cases.forEach(function(c){c.movements.forEach(function(mv){var t=new Date(mv.at).getTime();if(now-t<25*DAY&&now>t&&mv.to!=='NHRC'&&mv.action!=='Remark'){var to=roleUser(mv.to,c);mk('Automated','r-move',c,to,TPL.moved.text(c,{from:mv.fromName}),t+40000,null,'moved');}});});
  cases.filter(isOpen).forEach(function(c,i){
    if(i%5===0){var t=now-(1+Math.floor(r()*9))*DAY-Math.floor(r()*6)*HOUR;var by=userById(i%2?'spc':'dgp');var to=roleUser(c.holder,c);if(to!==by.id)mk('Manual',null,c,to,dpd(c)>0?TPL.overdue.text(c):TPL.due.text(c),t,by,dpd(c)>0?'overdue':'due');}
    if(dpd(c)>0&&i%3===0){var t2=today().getTime()+10*HOUR;if(t2<now)mk('Automated','r-od',c,roleUser(c.holder,c),TPL.overdue.text(c),t2,null,'overdue');}
  });
  msgs.sort(function(a,b){return a.sendAt-b.sendAt;});
  return {sender:WA,messages:msgs,rules:defaultRules(),muted:{},optOut:optOut,seq:seq};
}
function waStatus(m){
  if(m.cancelled)return 'Cancelled';var now=Date.now();if(now<m.sendAt)return 'Scheduled';
  if(m.failed||(!m.logged&&state.wa.optOut[m.to]))return 'Failed';
  var el=now-m.sendAt,hv=parseInt(cyrb53(m.id).slice(0,4),16)%100;
  if(el<4000)return 'Sent';if(el<60000)return 'Delivered';return hv<72?'Read':'Delivered';
}
function canSeeMsg(u,m){if(u.role==='ADM'||u.role==='DGP')return true;if(m.by===u.id||m.to===u.id)return true;if(m.caseKey&&(u.role==='SPC'||u.role==='ICC'))return true;return false;}

function canManageRules(u){return u.role==='DGP'||u.role==='ADM';}

function waCreate(o){
  var W=state.wa;W.seq=(W.seq||0)+1;var to=userById(o.to)||{name:o.toName||String(o.to),mobile:o.toMobile||''};
  var m={id:'w'+W.seq+'-'+Date.now().toString(36),batch:o.batch||null,kind:o.kind,rule:o.rule||null,key:o.key||null,caseKey:o.caseKey||null,to:o.to,toName:to.name,toMobile:o.toMobile||to.mobile,text:o.text,tpl:o.tpl||'general',by:o.by,byName:o.byName,createdAt:new Date().toISOString(),sendAt:o.sendAt,cancelled:false,logged:false,failed:false};
  W.messages.push(m);if(W.messages.length>8000)W.messages.splice(0,W.messages.length-8000);

function waAuto(ruleId,c,u,x){
  var W=state.wa,rule=W.rules.find(function(r){return r.id===ruleId;});
  if(!rule||!rule.on||(c&&W.muted[c.key]))return 0;
  var rec=resolveRecip(rule.recip,c).filter(function(id){return !u||id!==u.id;});
  if(ruleId==='r-move'&&c){(c.team||[]).forEach(function(t){if(rec.indexOf(t.uid)<0&&(!u||t.uid!==u.id))rec.push(t.uid);});if(c.respondent&&c.respondent.type==='user'&&c.respondent.status==='Nominated'&&rec.indexOf(c.respondent.uid)<0&&(!u||c.respondent.uid!==u.id))rec.push(c.respondent.uid);}
  rec.forEach(function(id){waCreate({kind:'Automated',rule:ruleId,caseKey:c.key,to:id,text:(ruleId==='r-move'&&id!==roleUser(c.holder,c))?'NHRC file '+c.id+' in your working group has moved to '+holderName(c,c.holder)+(x&&x.from?', sent by '+x.from:'')+'. Report due to NHRC on '+fmtD(c.due)+'.':TPL[rule.tpl].text(c,x),tpl:rule.tpl,by:'system',byName:SYSUSER.name,sendAt:Date.now()});});
  return rec.length;
}

function atTime(date,hhmm){var p=(hhmm||'09:00').split(':');var d=new Date(date);d.setHours(+p[0],+p[1],0,0);return d.getTime();}
function digestText(){var open=state.cases.filter(isOpen),td=iso(today()),n7=iso(addDays(today(),7)),hr=0;state.cases.forEach(function(c){(c.orders||[]).forEach(function(o){if(oLive(o)&&o.nextHearing>=td&&o.nextHearing<=n7)hr++;});});
  return 'Weekly summary from the NHRC Complaint Management System: '+open.length+' open files, '+open.filter(function(c){return dpd(c)>0;}).length+' overdue, '+open.filter(function(c){var t=toDue(c);return t>=0&&t<=7;}).length+' due in the next 7 days, and '+hr+' court hearings this week.';}
function runScheduler(){
  if(!state||!state.wa)return;
  var W=state.wa,now=Date.now(),horizon=now+14*DAY,want={};
  if(!W.rules.some(function(r){return r.id==='r-resp';}))W.rules.push({id:'r-resp',trigger:'respondent_before',on:true,days:1,time:'09:30',recip:'respondent',tpl:'resp'});
  function add(key,o){want[key]=o;}
  W.rules.forEach(function(rule){
    if(!rule.on||rule.trigger==='on_move')return;
    if(rule.trigger==='overdue_daily'){
      var cand=atTime(today(),rule.time);if(cand<=now)cand=atTime(addDays(today(),1),rule.time);
      var dIso=iso(new Date(cand)),byR={};
      state.cases.forEach(function(c){if(!isOpen(c)||W.muted[c.key]||!(c.due<dIso))return;resolveRecip(rule.recip,c).forEach(function(id){(byR[id]=byR[id]||[]).push(c);});});
      Object.keys(byR).forEach(function(id){var l=byR[id].sort(function(a,b){return a.due<b.due?-1:1;});
        var text=l.length===1?TPL.overdue.text(l[0],{days:diffDays(new Date(cand),l[0].due)}):'Overdue files: you hold '+l.length+' NHRC files past the report due date. Oldest: '+l.slice(0,5).map(function(c){return c.id+' ('+diffDays(new Date(cand),c.due)+' days)';}).join(', ')+(l.length>5?' and '+(l.length-5)+' more':'')+'. Please open the NHRC Complaint Management System.';
        add(rule.id+'|'+cand+'|'+id,{rule:rule,c:l.length===1?l[0]:null,to:id,t:cand,text:text});});
      return;
    }
    if(rule.trigger==='respondent_before'){state.cases.forEach(function(c){var r=c.respondent;if(!isOpen(c)||W.muted[c.key]||!r||r.status!=='Nominated')return;var t=atTime(addDays(pd(r.due),-rule.days),rule.time);if(t<=now||t>horizon)return;var txt=TPL.resp.text(c,{r:r});if(r.type==='user')add(rule.id+'|'+c.key+'|'+t+'|'+r.uid,{rule:rule,c:c,to:r.uid,t:t,text:txt});else if(r.consent)add(rule.id+'|'+c.key+'|'+t+'|ext',{rule:rule,c:c,to:'ext-'+c.key,toName:r.name+' (respondent)',toMobile:r.mobile,t:t,text:txt});});return;}
    if(rule.trigger==='weekly_digest'){
      var d=today();var t=atTime(d,rule.time);var dow=(d.getDay()+6)%7+1;var off=(rule.days-dow+7)%7;t=atTime(addDays(d,off),rule.time);if(t<=now)t=atTime(addDays(d,off+7),rule.time);
      resolveRecip(rule.recip,null).forEach(function(id){add(rule.id+'|'+t+'|'+id,{rule:rule,c:null,to:id,t:t,text:digestText()});});return;
    }
    state.cases.forEach(function(c){
      if(!isOpen(c)||W.muted[c.key])return;
      var times=[];
      if(rule.trigger==='due_before')times.push({t:atTime(addDays(pd(c.due),-rule.days),rule.time),x:{days:rule.days}});
      if(rule.trigger==='overdue_daily'){var cand=atTime(today(),rule.time);if(cand<=now)cand=atTime(addDays(today(),1),rule.time);var first=atTime(addDays(pd(c.due),1),rule.time);var t2=Math.max(cand,first);times.push({t:t2,x:{days:diffDays(new Date(t2),c.due)}});}
      if(rule.trigger==='hearing_before'||rule.trigger==='compliance_before')(c.orders||[]).forEach(function(o){if(!oLive(o))return;var dd=rule.trigger==='hearing_before'?o.nextHearing:o.complianceDue;if(dd)times.push({t:atTime(addDays(pd(dd),-rule.days),rule.time),x:{o:o},oid:o.id});});
      times.forEach(function(it){if(it.t<=now||it.t>horizon)return;resolveRecip(rule.recip,c).forEach(function(id){add(rule.id+'|'+c.key+'|'+(it.oid||'')+'|'+it.t+'|'+id,{rule:rule,c:c,to:id,t:it.t,text:TPL[rule.tpl].text(c,it.x)});});});
    });
  });
  var keep=[];
  W.messages.forEach(function(m){
    if(m.kind==='Automated'&&m.key&&m.sendAt>now&&!m.cancelled){var w=want[m.key];if(w){m.text=w.text;keep.push(m);delete want[m.key];}return;}
    if(m.cancelled&&m.key&&want[m.key])delete want[m.key];
    keep.push(m);
  });
  W.messages=keep;
  Object.keys(want).forEach(function(k){var w=want[k];waCreate({kind:'Automated',rule:w.rule.id,key:k,caseKey:w.c?w.c.key:null,to:w.to,toName:w.toName,toMobile:w.toMobile,text:w.text,tpl:w.rule.tpl,by:'system',byName:SYSUSER.name,sendAt:w.t});});
  W.messages.forEach(function(m){if(!m.logged&&!m.cancelled&&m.sendAt<=now)waLogSend(m,m.kind==='Automated'?SYSUSER:{id:'system',name:'WhatsApp scheduler (for '+m.byName+')',role:'-'});});
  save();
}

function pageWA(u,q){
  var tab=q.tab||'outbox',vm=visibleMsgs(u),td=iso(today());

/* ================= v11: IP address and location on every log ================= */
var NET={ip:'',place:'',isp:'',gps:null,gpsPlace:'',state:'pending',gpsState:'not asked'};
try{var n0=JSON.parse(sessionStorage.getItem('apnhrc_net')||'null');if(n0&&typeof n0==='object'){NET=n0;if(NET.state==='pending'&&!NET.ip)NET.state='pending';}}catch(e){}
function saveNet(){try{sessionStorage.setItem('apnhrc_net',JSON.stringify(NET));}catch(e){}}
function fetchJSON(url,ms){return new Promise(function(res,rej){var done=false,t=setTimeout(function(){if(!done){done=true;rej(new Error('timeout'));}},ms||5000);
  try{fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();}).then(function(j){if(!done){done=true;clearTimeout(t);res(j);}}).catch(function(e){if(!done){done=true;clearTimeout(t);rej(e);}});}catch(e){done=true;clearTimeout(t);rej(e);}});}
function loadNet(){
  return fetchJSON('https://ipapi.co/json/').then(function(j){if(!j||!j.ip)throw 0;NET.ip=j.ip;NET.place=[j.city,j.region,j.country_code||j.country].filter(Boolean).join(', ');NET.isp=j.org||'';})
  .catch(function(){return fetchJSON('https://ipwho.is/').then(function(j){if(!j||!j.ip)throw 0;NET.ip=j.ip;NET.place=[j.city,j.region,j.country_code].filter(Boolean).join(', ');NET.isp=(j.connection&&j.connection.isp)||'';});})
  .catch(function(){return fetchJSON('https://api.ipify.org?format=json').then(function(j){if(j&&j.ip)NET.ip=j.ip;});})
  .catch(function(){}).then(function(){NET.state=NET.ip?'ok':'unavailable';saveNet();});
}
function askGPS(){return new Promise(function(res){
  if(!navigator.geolocation){NET.gpsState='not supported';saveNet();return res();}
  NET.gpsState='asking';
  try{navigator.geolocation.getCurrentPosition(function(p){
    NET.gps={lat:+p.coords.latitude.toFixed(5),lon:+p.coords.longitude.toFixed(5),acc:Math.round(p.coords.accuracy)};NET.gpsState='allowed';
    fetchJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+NET.gps.lat+'&longitude='+NET.gps.lon+'&localityLanguage=en').then(function(j){NET.gpsPlace=[j.locality||j.city,j.principalSubdivision,j.countryCode].filter(Boolean).join(', ');}).catch(function(){})
      .then(function(){saveNet();if(U())log('Authentication','Precise location recorded','Session',locStr());res();});
  },function(e){NET.gpsState=e&&e.code===1?'denied':'unavailable';saveNet();if(U())log('Authentication','Precise location '+(NET.gpsState==='denied'?'refused by user':'unavailable'),'Session','Falling back to '+locStr());res();},{enableHighAccuracy:true,timeout:10000,maximumAge:300000});}
  catch(e){NET.gpsState='unavailable';saveNet();res();}
});}
function ipStr(){return NET.ip||(NET.state==='pending'?'Looking up':'Unavailable');}
function locStr(){
  if(NET.gps)return (NET.gpsPlace||NET.place||'Place not named')+' (GPS '+NET.gps.lat+', '+NET.gps.lon+', within '+NET.gps.acc+' m)';
  if(NET.place)return NET.place+' (approximate, from IP)';
  return NET.state==='pending'?'Looking up':'Unavailable';
}
function shortLoc(s){return String(s||'').replace(/ \(GPS [^)]*\)/,' (GPS)').replace(/ \(approximate, from IP\)/,' (approx.)');}
function pinIcon(){return '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" style="vertical-align:-1px"><path d="M6 11s4-3.8 4-6.5A4 4 0 0 0 2 4.5C2 7.2 6 11 6 11z" fill="#dff2f7" stroke="#2a6576"/><circle cx="6" cy="4.6" r="1.4" fill="#2a6576"/></svg>';}
function sampleIp(id){var h=cyrb53('ip'+id);return '103.'+(20+parseInt(h.slice(0,2),16)%200)+'.'+parseInt(h.slice(2,4),16)+'.'+(1+parseInt(h.slice(4,6),16)%250);}

/* ================= v12: dropdowns, calendars and time pickers drawn inside the page =================
   The native <select> and date inputs stay in the DOM as the value holders, so every other part of the
   system keeps working. They are visually hidden and a panel drawn in the page is shown instead, which
   means the list is captured when the screen is shared. */
var openPanel=null,PANEL_PAD=6;
function closePanel(){if(openPanel){if(openPanel.btn)openPanel.btn.setAttribute('aria-expanded','false');if(openPanel.el&&openPanel.el.parentNode)openPanel.el.parentNode.removeChild(openPanel.el);openPanel=null;}}
function placePanel(el,btn){
  var r=btn.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight;
  if(!el.classList.contains('xdate-p'))el.style.minWidth=Math.min(r.width,vw-16)+'px';
  var w=el.offsetWidth,ph=el.offsetHeight;

/* ================= Domain rules ================= */
function isOpen(c){return c.status==='Open';}
function canView(u,c){if(u.role==='ADM')return false;if(c.status==='Removed')return isSupervisor(u);if(u.role!=='DSP')return true;if(c.district===u.district)return true;return !!teamRole(c,u.id)||isRespondent(c,u.id);}
function visibleCases(u){return state.cases.filter(function(c){return c.status!=='Removed'&&canView(u,c);});}
function isMine(u,c){return isOpen(c)&&c.holder===u.role&&(u.role!=='DSP'||c.district===u.district);}
function canCreate(u){return ['DGP','SPC','ICC'].indexOf(u.role)>=0;}
function nextDown(r){return ORDER[ORDER.indexOf(r)+1];}
function nextUp(r){var i=ORDER.indexOf(r);return i>0?ORDER[i-1]:undefined;}
function holderName(c,r){if(r==='DSP')return 'SP '+c.district;if(r==='NHRC')return 'NHRC';return ROLES[r]?ROLES[r].short:r;}
function canDownload(u,a){if(a.byUser===u.id)return true;if(a.cls==='Open')return true;if(a.cls==='Restricted')return u.role!=='DSP';return u.role==='DGP'||u.role==='SPC';}
function dpd(c){if(!isOpen(c))return 0;return Math.max(0,diffDays(today(),c.due));}
function toDue(c){return diffDays(c.due,today());}
function bucketOf(c){var d=dpd(c);for(var i=0;i<BUCKETS.length;i++)if(BUCKETS[i].test(d))return BUCKETS[i].k;return 'W';}
function bucket(k){return BUCKETS.find(function(b){return b.k===k;});}
function lastMove(c){return c.movements[c.movements.length-1];}
function inHand(c){var m=lastMove(c);return m?diffDays(today(),new Date(m.at)):0;}
function move(c,u,to,action,note){c.movements.push({at:new Date().toISOString(),from:u.role,fromName:u.name,fromUser:u.id,to:to,toName:holderName(c,to),action:action,note:note});if(ORDER.indexOf(to)>=0)c.holder=to;}
function getCase(k){return state.cases.find(function(c){return c.key===k;});}
/* tickets */
function getTicket(k){return state.tickets.find(function(t){return t.key===k;});}
function canSeeTicket(u,t){return u.role==='ADM'||u.role==='DGP'||t.by===u.id;}
function visibleTickets(u){return state.tickets.filter(function(t){return canSeeTicket(u,t);});}
function isLive(t){return t.status!=='Resolved'&&t.status!=='Closed';}
function slaState(t){
  var due=new Date(t.slaDue).getTime();
  if(t.resolvedAt)return new Date(t.resolvedAt).getTime()<=due?{k:'met',label:'SLA met',color:'mint'}:{k:'missed',label:'SLA missed',color:'rose'};
  var left=due-Date.now();
  if(left<0)return {k:'breach',label:'Breached '+dur(-left)+' ago',color:'rose'};
  if(left<PRIS[t.pri].h*HOUR*0.25)return {k:'risk',label:dur(left)+' left',color:'peach'};
  return {k:'ok',label:dur(left)+' left',color:'mint'};
}
function tStatus(t,u,to,note){var from=t.status;if(from===to)return;t.status=to;t.updatedAt=new Date().toISOString();if(to==='Resolved')t.resolvedAt=t.updatedAt;if(to==='Open'||to==='In progress'||to==='Awaiting user'){if(from==='Resolved'||from==='Closed')t.resolvedAt=null;}t.thread.push({type:'status',at:t.updatedAt,by:u.id,byName:u.name,byRole:u.role,text:'Status changed from '+from+' to '+to+(note?'. '+note:'')});log('Helpdesk','Changed ticket status',t.id,from+' to '+to);}

function rolePill(r,label){var R=ROLES[r];return '<span class="pill bg-'+(R?R.color:'soft')+'">'+esc(label||(R?R.short:r))+'</span>';}
function statusPill(c){if(c.status==='Removed')return '<span class="pill bg-rose">Removed</span>';return isOpen(c)?'<span class="pill bg-blue">Open</span>':'<span class="pill bg-sage">Closed</span>';}
function dpdPill(c){if(!isOpen(c))return '<span class="muted">-</span>';var d=dpd(c);if(d>0){var b=bucket(bucketOf(c));return '<span class="pill bg-'+b.color+'">'+d+' DPD</span>';}var t=toDue(c);return '<span class="pill bg-'+(t<=7?'butter':'mint')+'">'+(t===0?'Due today':'Due in '+t+' d')+'</span>';}
function tPill(s){return '<span class="pill bg-'+TSTAT[s]+'">'+esc(s)+'</span>';}
function pPill(p){return '<span class="pill bg-'+PRIS[p].color+'">'+PRIS[p].label+'</span>';}
function slaPill(t){var s=slaState(t);return '<span class="pill bg-'+s.color+'">'+s.label+'</span>';}
function opt(v,l,cur){return '<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(l)+'</option>';}
function emblem(size){size=size||42;return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 48 48" aria-hidden="true" style="flex:none"><path d="M24 3 L42 9 V23 C42 34 34 41 24 45 C14 41 6 34 6 23 V9 Z" fill="#e0ecfb" stroke="#35598c" stroke-width="1.5"/><path d="M24 13 l3.1 6.4 7 .9 -5.1 4.9 1.3 6.9 -6.3 -3.4 -6.3 3.4 1.3 -6.9 -5.1 -4.9 7 -.9 z" fill="#fbf3d0" stroke="#77600f" stroke-width="1"/></svg>';}
function denied(msg){return {html:'<div class="card bg-rose">'+msg+'</div>'};}

function officersFor(level){return USERS.filter(function(u){return u.role===level;});}
function paneLevel(prefLevel,prefUid){
  clearInterval(otpTimer);
  var lv=prefLevel||'DGP';
  $('#pane').innerHTML='<div class="pane-brand">'+emblem(36)+'<div><div>Arunachal Pradesh Police</div><div class="xs muted">NHRC Complaint Management System</div></div></div><h2>Sign in</h2><p class="sub">Choose your user level. A one-time code will be sent to your registered mobile number.</p>'+
    '<div class="fg"><label class="f" for="lv">User level</label><select id="lv">'+LEVELS.map(function(r){return opt(r,ROLES[r].title,lv);}).join('')+'</select></div>'+

    '<div class="fg"><label class="f" for="lm">Registered mobile number</label><div class="tel"><span>+91</span><input id="lm" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national"></div><div class="xs muted" id="lmh" style="margin-top:4px"></div></div>'+

    '<button class="btn pri block" data-act="send-otp">Send OTP</button>'+
    '<p class="s" style="text-align:center;margin:16px 0 0"><a data-act="to-recover">Trouble signing in?</a> | <a data-act="guide">How this system works</a></p>'+
    '<div class="demo-note">Demo: the registered number fills in for the chosen officer. The OTP is 123456.</div><p class="xs muted" style="margin:12px 0 0">'+pinIcon()+' For security, your IP address and location are recorded with every action. Your browser may ask to share your location.</p>';

function fillOfficers(prefUid){
  var lv=$('#lv').value,list=officersFor(lv),lo=$('#lo');
  lo.innerHTML=list.map(function(u){return opt(u.id,u.role==='DSP'?u.district+' district':u.name,prefUid||'');}).join('');
  lo.disabled=list.length<2;
  $('#lo-wrap').querySelector('label').textContent=lv==='DSP'?'District':'Officer';
  fillMobile();
}
function fillMobile(){var u=userById($('#lo').value);$('#lm').value=u.mobile;$('#lmh').textContent='Registered number on record ends in '+u.mobile.slice(-3)+'.';$('#lerr').textContent='';}
function sendOtp(){
  if(NET.gpsState==='not asked')askGPS();
  var u=userById($('#lo').value),m=$('#lm').value.replace(/\D/g,'');
  if(m.length!==10){$('#lerr').textContent='Enter the 10-digit mobile number.';$('#lm').focus();return;}
  if(m!==u.mobile){$('#lerr').textContent='This number is not registered for '+u.name+'. Check the number or the user level.';log('Authentication','OTP request refused',u.name,'Number '+mask(m)+' does not match the record',{id:'guest',name:'Guest',role:'-'});return;}
  pendingSid='S-'+cyrb53(u.id+Date.now()).slice(0,8).toUpperCase();
  otp={uid:u.id,code:DEMO_OTP,sent:Date.now(),exp:Date.now()+OTP_TTL,resend:Date.now()+OTP_RESEND,tries:0};
  log('Authentication','OTP sent',u.name,'Sent to '+mask(u.mobile),u);
  paneOtp();
}
function paneOtp(){
  var u=userById(otp.uid);
  $('#pane').innerHTML='<a class="back" data-act="otp-back">Change level or number</a>'+
    '<h2>Enter verification code</h2><p class="sub">We sent a 6-digit code to '+esc(mask(u.mobile))+' for '+esc(u.name)+'.</p>'+
    '<div class="otp" id="otpbox">'+[0,1,2,3,4,5].map(function(i){return '<input class="ob" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="'+(i===0?'one-time-code':'off')+'" aria-label="Digit '+(i+1)+'">';}).join('')+'</div>'+
    '<div class="otp-meta"><span id="otpexp"></span><button class="linkbtn" id="resend" data-act="resend" disabled></button></div>'+
    '<div class="err" id="lerr" style="margin-top:12px"></div>'+
    '<label class="ck"><input type="checkbox" id="otp-keep"> Keep me signed in on this device for 8 hours</label>'+'<button class="btn pri block" data-act="verify-otp" style="margin-top:6px">Verify and sign in</button>'+
    '<div class="demo-note">Demo OTP: <b>123456</b></div>';
  $('.ob').focus();tickOtp();clearInterval(otpTimer);otpTimer=setInterval(tickOtp,1000);
}
function tickOtp(){
  if(!otp||!$('#otpexp')){clearInterval(otpTimer);return;}
  var n=Date.now(),e=Math.max(0,otp.exp-n),r=Math.max(0,otp.resend-n);
  $('#otpexp').textContent=e?'Code expires in '+Math.floor(e/60000)+':'+pad(Math.floor(e%60000/1000),2):'Code expired. Request a new one.';
  var b=$('#resend');b.disabled=r>0;b.textContent=r?'Resend code in 0:'+pad(Math.ceil(r/1000),2):'Resend code';
}
function otpValue(){return $$('.ob').map(function(i){return i.value;}).join('');}
function verifyOtp(){
  if(!otp)return;
  var u=userById(otp.uid),v=otpValue(),box=$('#otpbox');
  if(v.length<6){$('#lerr').textContent='Enter all 6 digits.';return;}
  if(Date.now()>otp.exp){$('#lerr').textContent='This code has expired. Request a new one.';log('Authentication','OTP expired',u.name,'Code used after 2 minutes',u);return;}
  if(otp.tries>=3){$('#lerr').textContent='Too many wrong attempts. Request a new code.';return;}
  if(v!==otp.code){
    otp.tries++;box.classList.add('bad');
    log('Authentication','OTP failed',u.name,'Wrong code entered, attempt '+otp.tries+' of 3',u);
    if(otp.tries>=3){otp.exp=0;$('#lerr').textContent='Too many wrong attempts. This code is now blocked. Request a new code.';log('Authentication','OTP blocked',u.name,'Three wrong attempts',u);}
    else $('#lerr').textContent='That code is not right. '+(3-otp.tries)+' attempt'+(3-otp.tries>1?'s':'')+' left.';
    $$('.ob').forEach(function(i){i.value='';});$('.ob').focus();return;
  }
  var kpOn=$('#otp-keep')&&$('#otp-keep').checked;clearInterval(otpTimer);startSession(u);otp=null;
  log('Authentication','Signed in','Sign in','OTP verified. IP '+ipStr()+', '+locStr()+(NET.isp?', network '+NET.isp:''));if(kpOn)setKeep(8);
  go('#/dashboard');toast('Signed in as '+u.name+'.');
}

function recoverSend(){
  var m=$('#rm').value.replace(/\D/g,'');

  var guest={id:'guest',name:'Guest ('+ROLES[$('#rv').value].short+', '+mask(m)+')',role:'-'};

}

function parseEmail(){

var GUIDE='<div class="mh"><h2>How this system works</h2><button class="btn" data-act="mclose">Close</button></div>'+
'<p class="muted" style="margin-top:0">Prototype for Arunachal Pradesh Police Headquarters, Itanagar. Platform by AMARTRACK. This one file holds the whole system with no outside files. Data is sample data kept in this browser only.</p>'+
'<h3 style="margin:18px 0 6px">Sign in</h3><p style="margin:0">Choose the user level (DGP, SP Crime, IC Crime, District SP or System Administrator). For District SP choose the district. The registered mobile number fills in. Send OTP and enter the code <b>123456</b>. Codes expire after 2 minutes, can be resent after 30 seconds, and three wrong attempts block the code. Sessions end after 15 minutes without activity.</p>'+
'<h3 style="margin:18px 0 6px">File movement</h3><p style="margin:0">A complaint is diarised and placed before the DGP, then marked down to SP Crime, IC Crime and the district SP for enquiry, and submitted back up for approval. Only the holder of a file can move it, add a minute or upload documents. Only the DGP approves the ATR and closes the file.</p>'+
'<h3 style="margin:18px 0 6px">Documents</h3><p style="margin:0">PDF and image files up to 3 MB. Open documents are visible to anyone who can see the file, Restricted to PHQ officers, Confidential to the DGP and SP Crime. The uploader can always open their own document.</p>'+
'<h3 style="margin:18px 0 6px">Dashboard</h3><p style="margin:0">DPD means days past the report due date set by the Commission. Open files are grouped by DPD bucket, category, current holder and district. Every figure opens the filtered register.</p>'+
'<h3 style="margin:18px 0 6px">Helpdesk tickets</h3><p style="margin:0">Any user can raise a ticket. Response targets: P1 Critical 4 hours, P2 High 8 hours, P3 Normal 24 hours, P4 Low 72 hours. The System Administrator replies and resolves; the person who raised it confirms and closes, or reopens.</p>'+
'<h3 style="margin:18px 0 6px">Audit log</h3><p style="margin:0">Every sign-in step, page, filter, search, file move, document action and ticket action is recorded with the device and session. Entries are chained by fingerprint, so Verify integrity detects any edit or deletion. The DGP and System Administrator see the full log; others see their own activity.</p>'+
'<h3 style="margin:18px 0 6px">Bulk upload for first-time setup</h3><p style="margin:0">On Diarise complaint, the Bulk upload tab takes an Excel or CSV sheet of up to 10,000 complaints. Download the template, fill one row per complaint (required: NHRC case no, received on, district, complainant, subject), upload it and review the check. Rows with errors can be skipped, duplicates are skipped automatically, and a whole batch can be undone while its files are untouched.</p>'+'<h3 style="margin:18px 0 6px">Sorting, HIGH priority and hiding</h3><p style="margin:0">Select any date or number heading to sort; select again to reverse. Lists open with the latest date on top. PHQ officers can mark a file HIGH priority with a reason; it then carries a red flag on the dashboard, the register and the file, and appears in the HIGH priority group. Any officer can hide files from their own register and bring them back with Show all.</p>'+'<h3 style="margin:18px 0 6px">Security timer and drafts</h3><p style="margin:0">Every log entry records the IP address and location: precise GPS location if the officer allows it, otherwise the approximate place from the IP address. Officers can choose Stay signed in, either on the timer or on the sign-in screen, or for 1 or 8 hours from My profile. After 1 minute without activity, or when the device sleeps, a 30 second timer appears. When it ends you are signed out and need a new OTP. New complaints, edits and minutes save as drafts every 10 seconds, shown in grey on the screen, and are listed under Drafts.</p>'+'<h3 style="margin:18px 0 6px">Working group, respondent and supervisory actions</h3><p style="margin:0">Any file can have a working group: officers from PHQ or other districts added as members (read, post notes, upload) or observers (read, get updates). A respondent can be nominated, either an officer in the system or someone outside it with a mobile number, with a reply due date; their reply is recorded on the file and they get a reminder the day before it is due. The DGP and SP Crime can transfer a file to another district, reassign it to any officer, or remove it to the Removed files list, from where it can be restored. Every one of these actions, and the Update to all button, sends a WhatsApp message from the dedicated number to everyone on the file. The bell at the top shows your own notifications.</p>'+'<h3 style="margin:18px 0 6px">Court orders</h3><p style="margin:0">Record each court order on its complaint file with the court, order number, date, type, directions, compliance date and next hearing, and upload the order copy. Officers add dated updates with an optional file, and PHQ officers can change the order status. The Court orders page lists every order with its latest update.</p>'+'<h3 style="margin:18px 0 6px">Calendar and date filters</h3><p style="margin:0">The Calendar shows NHRC due dates, hearings, compliance dates, order updates, scheduled WhatsApp alerts and ticket deadlines by month. Every list, and the dashboard, has a date filter with quick ranges such as today, this week and last 30 days, or a custom range picked from the calendar.</p>'+'<h3 style="margin:18px 0 6px">WhatsApp alerts</h3><p style="margin:0">All alerts go out from one dedicated number, '+WA.number+'. From any file, send or schedule a message to one or several officers authorised for that file. Automated rules send alerts when a file reaches an officer, before NHRC due dates, daily while overdue, before hearings and compliance dates, and a weekly summary. Messages carry the file number and dates only. The prototype simulates delivery; a live system uses the WhatsApp Business Platform with approved templates and officer opt-in.</p>'+'<h3 style="margin:18px 0 6px">Devices</h3><p style="margin:0">Works on phones, tablets, laptops and wide screens, in portrait and landscape.</p>'+
'<h3 style="margin:18px 0 6px">Hosting</h3><p style="margin:0">Upload this single HTML file to a GitHub repository and turn on GitHub Pages. For a live service, the OTP needs a government SMS gateway and the data needs a server with encrypted storage hosted in India.</p>';
