<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | AMARTRACK</title>

<style>

body{
font-family: "Segoe UI", system-ui, sans-serif;
background:#FAFAFA;
margin:0;
}

.container{
max-width:1200px;
margin:auto;
padding:80px 24px;
}

h1{
font-family: Georgia, serif;
margin-bottom:40px;
}

.gallery-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:24px;
}

.gallery-item{
display:flex;
flex-direction:column;
}

.gallery-grid img{
width:100%;
height:240px;
object-fit:cover;
border-radius:12px;
transition:.3s;
cursor:pointer;
}

.gallery-grid img:hover{
transform:scale(1.02);
}

.photo-caption{
font-size:13px;
color:#666;
margin-top:6px;
}

.back{
margin-bottom:30px;
display:inline-block;
text-decoration:none;
color:#333;
}

/* LIGHTBOX */

#lightbox {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.8);
display: none;
justify-content: center;
align-items: center;
z-index: 9999;
}

#lightbox img {
max-width: 85%;
max-height: 85%;
border-radius: 12px;
}

</style>

</head>

<body>

<div class="container">

<a href="index.html" class="back">← Back to Main Site</a>

<h1>The Journey...</h1>

<div class="gallery-grid">
<div class="gallery-item">
<img src="images/Amity3.jpeg" onclick="openLightbox(this)">
<p class="photo-caption">AMITY University Greater, Noida </p>
</div>
  
<div class="gallery-item">
<img src="images/Amity2.jpeg" onclick="openLightbox(this)">
<p class="photo-caption">Director General Dr. Ajay Rana, Amity University 2024</p>
</div>

<div class="gallery-item">
<img src="images/Amity1.jpeg" onclick="openLightbox(this)">
<p class="photo-caption">AMITY Excellence Award 2024</p>
</div>

<div class="gallery-item">
<img src="images/photo1.jpg" onclick="openLightbox(this)">
<p class="photo-caption">Meeting with academic leadership during infrastructure discussion.</p>
</div>

</div>

</div>

<!-- LIGHTBOX HTML -->
<div id="lightbox" onclick="closeLightbox()">
<img id="lightbox-img">
</div>

<script>

function openLightbox(img){
document.getElementById("lightbox").style.display = "flex";
document.getElementById("lightbox-img").src = img.src;
}

function closeLightbox(){
document.getElementById("lightbox").style.display = "none";
}

</script>

</body>
</html>
